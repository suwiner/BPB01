name: Moyu Android APK
on:
  push:
    branches: [moyu-android-mobile-v1]
    paths:
      - 'moyu-android/**'
      - '.github/workflows/moyu-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android APK
        run: gradle -p moyu-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package and publish hash
        run: |
          set -euxo pipefail
          mkdir -p moyu-android/release
          cp moyu-android/app/build/outputs/apk/debug/app-debug.apk moyu-android/release/MoyuBrowser_Mobile_1.0.0.apk
          \"$ANDROID_HOME/build-tools/35.0.0/apksigner\" verify --verbose moyu-android/release/MoyuBrowser_Mobile_1.0.0.apk
          cd moyu-android/release
          sha256sum MoyuBrowser_Mobile_1.0.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoyuBrowser_Mobile_Android_APK
          path: |
            moyu-android/release/MoyuBrowser_Mobile_1.0.0.apk
            moyu-android/release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish APK to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f moyu-android/release/MoyuBrowser_Mobile_1.0.0.apk moyu-android/release/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build(android): publish installable mobile APK [skip ci]'
            git push
          fi
