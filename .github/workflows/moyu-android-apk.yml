name: Moyu Android APK V2.2 Coexist
on:
  push:
    branches: [moyu-android-mobile-v2-2-coexist]
    paths:
      - 'moyu-android/**'
      - '.github/workflows/moyu-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command-line tools and platform
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 -o /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools-extracted
          mv /tmp/android-tools-extracted/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android APK
        run: gradle -p moyu-android :app:assembleDebug --no-daemon --stacktrace
      - name: Static Android lint
        run: |
          gradle -p moyu-android :app:lintDebug --no-daemon || {
            cat moyu-android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          }
          cat moyu-android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Verify package and publish hash
        run: |
          set -euxo pipefail
          mkdir -p moyu-android/release
          cp moyu-android/app/build/outputs/apk/debug/app-debug.apk moyu-android/release/MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs moyu-android/release/MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk
          unzip -t -q moyu-android/release/MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging moyu-android/release/MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk | grep -F "name='com.moyu.browser.mobile' versionCode='4' versionName='2.2.0'"
          cd moyu-android/release
          sha256sum MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk > SHA256SUMS.txt
      - name: Include signing tool for offline secure release
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" moyu-android/release/apksigner.jar
          ls -lh moyu-android/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MoyuBrowser_Mobile_V2_2_Coexist_BuildKit
          path: |
            moyu-android/release/MoyuBrowser_Mobile_Coexist_2.2.0_DEBUG.apk
            moyu-android/release/SHA256SUMS.txt
            moyu-android/release/apksigner.jar
          retention-days: 30
      # This branch deliberately distributes build artifacts only.
      # Final release APK is signed offline using the private release certificate,
      # preventing Android signature changes between builds.
