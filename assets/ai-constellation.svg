<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 620" fill="none" aria-hidden="true">
<style>
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.22;transform:scale(.94)}}@keyframes dash{to{stroke-dashoffset:-640}}@keyframes node{50%{opacity:.38;transform:scale(.82)}}
.a{transform-origin:370px 300px;animation:spin 80s linear infinite}.b{transform-origin:370px 300px;animation:spin 110s linear reverse infinite}.dash{stroke-dasharray:7 18;animation:dash 28s linear infinite}.n{animation:node 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n:nth-child(3n){animation-delay:-1.3s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
