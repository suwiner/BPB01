<g stroke="url(#g)" stroke-width="1.2" opacity=".5"><path d="M95 235C174 161 248 119 350 148S562 168 673 116"/><path class="dash" d="M53 406C201 463 294 376 397 400S587 501 704 410"/><path d="M178 515Q313 460 396 536T647 517"/><path d="M82 115L172 164L258 100L409 152L577 72"/></g>
